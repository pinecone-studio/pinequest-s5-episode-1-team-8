# AI ресепшний (pinequest, баг 8) тогтмол хаяг: https://pinequest-team-8.<account>.workers.dev
# deploy: cd infra/cloudflare && npx wrangler deploy
name = "pinequest-team-8"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# "origin" = одоогийн quick tunnel хаяг (backend/ai_runtime/scripts/tunnel.py бичнэ)
[[kv_namespaces]]
binding = "ORIGIN"
id = "43db4a4e33fe441390a30dc82ba2688d"

[observability]
enabled = true
