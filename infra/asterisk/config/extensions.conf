[general]
static=yes
writeprotect=yes

[pinecone]
; 600 = Echo тест: ярьсан үгээ буцааж сонсоно (AI шаардлагагүй)
exten => 600,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 1000 = AI ресепшн (Python AudioSocket сервер рүү)
exten => 1000,1,NoOp(AI дуудлага: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${UUID},${AI_HOST}:${AI_PORT})
 same => n,Hangup()

; Бусад бүх дугаар (дараа нь SIP trunk-ээс ирэх дуудлага) -> AI
exten => _X.,1,Goto(pinecone,1000,1)
exten => s,1,Goto(pinecone,1000,1)
