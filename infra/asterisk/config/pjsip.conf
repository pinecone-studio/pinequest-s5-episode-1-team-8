; ================= Transport =================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Docker NAT-ийн ард байгаа тул утсанд лаптопын IP-г зарлана
external_media_address=${HOST_IP}
external_signaling_address=${HOST_IP}
local_net=172.16.0.0/12

; ================= Утас (Zoiper) =================
[phone1]
type=endpoint
transport=transport-udp
context=pinecone
disallow=all
allow=ulaw,alaw
auth=phone1-auth
aors=phone1
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[phone1-auth]
type=auth
auth_type=userpass
username=phone1
password=${PHONE_PASSWORD}

[phone1]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ================= Дараа нь: SIP trunk =================
; Оператороос мэдээлэл авсны дараа энд trunk нэмнэ.
; context=pinecone гэж тохируулбал AI кодыг өөрчлөх шаардлагагүй.
